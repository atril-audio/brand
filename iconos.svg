<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- ═══════════════════════════════════════════════════════════════════════
     PEDALERA · SET DE ICONOS DE LÍNEA · fijado 2026-08-17
     22 símbolos. Grilla de 24 · fill:none · stroke:currentColor · remates y
     uniones redondeados. El peso NO está acá: lo pone el CSS por tamaño.

     Uso:  <svg class="ico chico"><use href="#ico-bypass"/></svg>

     El peso por tamaño no es cosmético: los botones del nodo corren a 10.5px
     y un trazo de 2.0 mide 0.9px ahí. Ver iconos.css.
     ══════════════════════════════════════════════════════════════════════ -->
  <symbol id="ico-bypass" viewBox="0 0 24 24"><!-- bypass · pie del nodo · 10.5px -->
    <path d="M12 4v7"/><path d="M7.05 7.05a7 7 0 1 0 9.9 0"/>
  </symbol>
  <symbol id="ico-cambiar" viewBox="0 0 24 24"><!-- cambiar · pie del nodo · 10.5px -->
    <path d="M4 9h13l-3.2-3.2"/><path d="M20 15H7l3.2 3.2"/>
  </symbol>
  <symbol id="ico-abrir" viewBox="0 0 24 24"><!-- abrir el plugin · pie del nodo · 10.5px -->
    <path d="M14.5 4.5l5 5L9 20H4v-5z"/>
  </symbol>
  <symbol id="ico-sacar" viewBox="0 0 24 24"><!-- sacar · pie del nodo · 10.5px -->
    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
  </symbol>
  <symbol id="ico-puesto" viewBox="0 0 24 24"><!-- lugar reservado · nodo de plantilla -->
    <path d="M9 4.5H6.5a2 2 0 0 0-2 2V9M4.5 15v2.5a2 2 0 0 0 2 2H9"/> <path d="M15 4.5h2.5a2 2 0 0 1 2 2V9M19.5 15v2.5a2 2 0 0 1-2 2H15"/>
  </symbol>
  <symbol id="ico-verificado" viewBox="0 0 24 24"><!-- verificado · referencia de plantilla -->
    <path d="M5 12.5l4.5 4.5L19 6.5"/>
  </symbol>
  <symbol id="ico-desplegar" viewBox="0 0 24 24"><!-- desplegar · faceta, cuenta de trabajos -->
    <path d="M6.5 10l5.5 5.5L17.5 10"/>
  </symbol>
  <symbol id="ico-expandir" viewBox="0 0 24 24"><!-- expandir · lista, ficha -->
    <path d="M10 6.5l5.5 5.5L10 17.5"/>
  </symbol>
  <symbol id="ico-mono" viewBox="0 0 24 24"><!-- plegar a mono · franja de monitoreo -->
    <path d="M12 4.5v15"/><path d="M4 12h4M20 12h-4"/> <path d="M6.5 9.5L4 12l2.5 2.5M17.5 9.5L20 12l-2.5 2.5"/>
  </symbol>
  <symbol id="ico-plugins" viewBox="0 0 24 24"><!-- plugins · barra · 12px -->
    <path d="M4.5 5.5h6v6h-6zM13.5 5.5h6v6h-6zM4.5 13.5h6v6h-6zM13.5 13.5h6v6h-6z"/>
  </symbol>
  <symbol id="ico-buscar" viewBox="0 0 24 24"><!-- buscar · barra · 12px -->
    <path d="M16.5 11a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/><path d="M15.2 15.2L19.5 19.5"/>
  </symbol>
  <symbol id="ico-mas" viewBox="0 0 24 24"><!-- mas acciones · cabecera · 13px
       Los puntos se dibujan como trazos de longitud casi cero con remate
       redondo, igual que en ico-trabajo. Circulos con relleno serian invisibles:
       la clase .ico declara fill:none. -->
    <path d="M5 12h.01"/><path d="M12 12h.01"/><path d="M19 12h.01"/>
  </symbol>
  <!-- ── LOS RIGS ─────────────────────────────────────────────────────────
       Las cuatro acciones de un rig guardado. Suben desde el prototipo de
       Pedalera, donde vivian en un objeto local `ICOR` — que es exactamente el
       lugar donde un icono NO tiene que vivir: el sistema no se copia, se trae.

       Las cuatro son de 28x28 en su boton y se dibujan con el peso `medio`. -->
  <symbol id="ico-favorito" viewBox="0 0 24 24"><!-- favorito · estrella · 14px -->
    <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>
  </symbol>
  <symbol id="ico-duplicar" viewBox="0 0 24 24"><!-- duplicar · dos hojas · 14px
       La de atras se dibuja SOLO por sus dos lados visibles: cerrarla entera se
       veria como un cuadrado detras de otro, y lo que dice el icono es que una es
       copia de la otra. -->
    <rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 5.5H5.5v10"/>
  </symbol>
  <symbol id="ico-renombrar" viewBox="0 0 24 24"><!-- renombrar · lapiz · 14px
       ⚠️ NO es `ico-abrir`, que tambien es un lapiz: ese abre el editor de un
       plugin y este cambia un nombre. Dos acciones distintas con el mismo dibujo
       se confunden, asi que este va con la punta mas marcada y sin la diagonal
       larga del otro. -->
    <path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14.5 5.5l4 4"/>
  </symbol>
  <symbol id="ico-borrar" viewBox="0 0 24 24"><!-- borrar · tacho · 14px
       Un tacho y NO una ×: la × de `ico-sacar` saca un efecto de la cadena, que
       es reversible con ⌘Z. Esto borra un archivo del disco. -->
    <path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/>
  </symbol>
  <symbol id="ico-nivel" viewBox="0 0 24 24"><!-- nivel · barra · 12px -->
    <path d="M4 12h16"/><path d="M12.4 8.4h3.2v7.2h-3.2z"/>
  </symbol>
  <symbol id="ico-trabajo" viewBox="0 0 24 24"><!-- trabajo · barra · 12px -->
    <path d="M10.5 4.5H5.5a1 1 0 0 0-1 1v5l9 9 6-6-9-9z"/><path d="M8 8h.01"/>
  </symbol>
  <symbol id="ico-rigs" viewBox="0 0 24 24"><!-- rigs · barra · 12px -->
    <path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>
  </symbol>
  <symbol id="ico-plantillas" viewBox="0 0 24 24"><!-- ⚠️ MUERTO · las plantillas salieron del producto el 2026-08-18.
       No se borra aqui: borrar rompe a quien consume, en silencio y en otro
       repo, y eso pide SDD + ADR. Ver brand#15. -->
    <path d="M6 4.5h8.5L18 8v11.5H6z"/><path d="M9 11.5h6M9 15h4"/>
  </symbol>
  <symbol id="ico-analisis" viewBox="0 0 24 24"><!-- análisis · franja de monitoreo -->
    <path d="M3 12h3l3-6.5 3 13 3-9.5 2.5 3H21"/>
  </symbol>
  <symbol id="ico-en-grande" viewBox="0 0 24 24"><!-- lo mismo, en su pantalla · 12px
       Y no es `ico-expandir`, que es un chevron: eso ABRE lo que está al lado.
       Esto SALE a otra pantalla con lo mismo que ya estás viendo. -->
    <path d="M14 5h5v5M19 5l-8 8M10 5H5v14h14v-5"/>
  </symbol>
  <symbol id="ico-foto" viewBox="0 0 24 24"><!-- miniatura · rig guardado -->
    <path d="M4.5 8h3l1.5-2h6L16.5 8h3v11.5h-15z"/><path d="M15 13.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
  </symbol>
  <symbol id="ico-escanear" viewBox="0 0 24 24"><!-- escanear · barra · 12px -->
    <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 5v4.5H15"/>
  </symbol>
  <symbol id="ico-vaciar" viewBox="0 0 24 24"><!-- vaciar · barra · 12px -->
    <path d="M5 7.5h14M9.5 7.5V5h5v2.5"/><path d="M7 7.5v12h10v-12"/>
  </symbol>
  <symbol id="ico-deshacer" viewBox="0 0 24 24"><!-- deshacer · barra · 12px -->
    <path d="M4.5 10.5h8.5a4.75 4.75 0 1 1 0 9.5H8.5"/><path d="M4.5 10.5l4-4M4.5 10.5l4 4"/>
  </symbol>
</svg>
